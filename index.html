<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Cash Tracker & Ledger</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #2c3e50;
            font-size: 1.5rem;
        }

        /* Dashboard Cards */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 10px;
            border-left: 4px solid #3498db;
            text-align: center;
        }

        .stat-card.old {
            border-left-color: #9b59b6;
        }

        .stat-card span {
            font-size: 0.85rem;
            color: #7f8c8d;
            display: block;
            margin-bottom: 3px;
        }

        .stat-card h3 {
            font-size: 1.2rem;
            color: #2c3e50;
        }

        .section-title {
            font-size: 0.95rem;
            margin: 15px 0 8px 0;
            color: #34495e;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }

        /* Mobile Friendly Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
            gap: 6px;
            max-height: 150px;
            overflow-y: auto;
            padding: 4px;
            background: #fafbfc;
            border: 1px solid #edf2f7;
            border-radius: 8px;
        }

        .note-box {
            background: #fff;
            border: 1.5px solid #cbd5e1;
            border-radius: 6px;
            padding: 6px 2px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            font-size: 0.75rem;
            font-weight: 600;
            color: #475569;
        }

        .note-box:active {
            transform: scale(0.95);
        }

        .note-box.checked {
            background: #dcfce7;
            border-color: #22c55e;
            color: #94a3b8;
            text-decoration: line-through;
            opacity: 0.6;
        }

        /* Button Styles */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-done {
            background: #27ae60;
            color: white;
            display: none;
        }

        .btn-reset {
            background: #e74c3c;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Daily Cash Tracker</h2>
        
        <!-- Dashboard Statistics -->
        <div class="dashboard">
            <div class="stat-card">
                <span>Current Earnings</span>
                <h3 id="currentEarned">$ 0</h3>
            </div>
            <div class="stat-card old">
                <span>Old Balance</span>
                <h3 id="oldEarned">$ 0</h3>
            </div>
        </div>

        <!-- Note Categories ($0.5, $1, $2, $5, $10) -->
        <div class="section-title">$0.5 Notes <span id="count-0_5">0/200</span></div>
        <div class="grid-container" id="group-0_5"></div>

        <div class="section-title">$1 Notes <span id="count-1">0/200</span></div>
        <div class="grid-container" id="group-1"></div>

        <div class="section-title">$2 Notes <span id="count-2">0=100</span></div>
        <div class="grid-container" id="group-2"></div>

        <div class="section-title">$5 Notes <span id="count-5">0/60</span></div>
        <div class="grid-container" id="group-5"></div>

        <div class="section-title">$10 Notes <span id="count-10">0/20</span></div>
        <div class="grid-container" id="group-10"></div>

        <!-- Control Buttons -->
        <div class="btn-group">
            <button class="btn btn-done" id="doneBtn" onclick="archiveIncome()">All Done ($1,000)</button>
            <button class="btn btn-reset" onclick="resetData()">Reset Data</button>
        </div>
    </div>

    <script>
        const noteConfig = [
            { value: 0.5, count: 200, containerId: 'group-0_5', countId: 'count-0_5' },
            { value: 1, count: 200, containerId: 'group-1', countId: 'count-1' },
            { value: 2, count: 100, containerId: 'group-2', countId: 'count-2' },
            { value: 5, count: 60, containerId: 'group-5', countId: 'count-5' },
            { value: 10, count: 20, containerId: 'group-10', countId: 'count-10' }
        ];

        let savedState = JSON.parse(localStorage.getItem('incomeTrackerStateUSD')) || {};
        let totalOldIncome = parseFloat(localStorage.getItem('oldIncomeAmountUSD')) || 0;

        function renderBoxes() {
            let totalCurrentEarned = 0;

            noteConfig.forEach(group => {
                const container = document.getElementById(group.containerId);
                const countLabel = document.getElementById(group.countId);
                container.innerHTML = '';
                
                let checkedCount = 0;

                for (let i = 1; i <= group.count; i++) {
                    const boxId = `${group.value}_${i}`;
                    const box = document.createElement('div');
                    box.className = 'note-box';
                    box.innerText = `$${group.value}`;

                    if (savedState[boxId]) {
                        box.classList.add('checked');
                        totalCurrentEarned += group.value;
                        checkedCount++;
                    }

                    box.onclick = function() {
                        if (savedState[boxId]) {
                            if (confirm(`Do you want to remove this $${group.value} entry?`)) {
                                delete savedState[boxId];
                                box.classList.remove('checked');
                                localStorage.setItem('incomeTrackerStateUSD', JSON.stringify(savedState));
                                updateUI();
                            }
                        } else {
                            savedState[boxId] = true;
                            box.classList.add('checked');
                            localStorage.setItem('incomeTrackerStateUSD', JSON.stringify(savedState));
                            updateUI();
                        }
                    };

                    container.appendChild(box);
                }
                countLabel.innerText = `${checkedCount}/${group.count}`;
            });

            document.getElementById('currentEarned').innerText = `$ ${totalCurrentEarned.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 2 })}`;
            document.getElementById('oldEarned').innerText = `$ ${totalOldIncome.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 2 })}`;

            const doneBtn = document.getElementById('doneBtn');
            if (totalCurrentEarned >= 1000) {
                doneBtn.style.display = 'block';
            } else {
                doneBtn.style.display = 'none';
            }
        }

        function updateUI() {
            renderBoxes();
        }

        function archiveIncome() {
            if (confirm('Congratulations! Your $1,000 target has been reached. Do you want to archive this amount to Old Balance and clear the list?')) {
                totalOldIncome += 1000;
                localStorage.setItem('oldIncomeAmountUSD', totalOldIncome);
                
                savedState = {};
                localStorage.removeItem('incomeTrackerStateUSD');
                
                renderBoxes();
            }
        }

        function resetData() {
            if (confirm('Are you sure you want to reset current tracking data?')) {
                savedState = {};
                localStorage.removeItem('incomeTrackerStateUSD');
                renderBoxes();
            }
        }

        renderBoxes();
    </script>

</body>
</html>
